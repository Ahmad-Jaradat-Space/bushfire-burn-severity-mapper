extends: ../config.yaml

# Honest event-wise hold-out: train on the two NSW fires, validate on Kangaroo
# Island, test on East Gippsland. This is the protocol the notebook argues is the
# only trustworthy one — and the checkpoint it produces is what Phase B's
# uncertainty / conformal analysis runs on.
experiment:
  name: unet_eventwise
  model: unet
  split_mode: event_wise
  temporal_mode: event_specific

unet:
  encoder_name: resnet34
  in_channels: 18
  num_classes: 4
  decoder_channels: [256, 128, 64, 32, 16]
  encoder_weights: null
  dropout: 0.1                      # now genuinely wired -> enables MC-dropout UQ

train:
  batch_size: 8
  grad_accum_steps: 2
  epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_steps: 100
  loss:
    ce_weight: 0.5
    dice_weight: 0.5
  ignore_index: 255
  early_stop_patience: 12
  log_every: 25
  num_workers: 2
  pin_memory: false

augment:
  hflip: 0.5
  vflip: 0.5
  rotate90: 0.5
  brightness_jitter: 0.05
  noise_sigma: 0.005

fast_mode:
  epochs: 5
  max_tiles_train: 200
  max_tiles_val: 50

outputs:
  prediction_dir: outputs/predictions/unet_eventwise
  metrics_dir: outputs/metrics/unet_eventwise
  model_dir: outputs/models/unet_eventwise
  log_dir: outputs/logs/unet_eventwise
